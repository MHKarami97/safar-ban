<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <script>
    (function () {
      var redirect = sessionStorage.getItem('safarban-redirect')
      sessionStorage.removeItem('safarban-redirect')
      if (redirect && redirect !== location.href) {
        var url = new URL(redirect)
        history.replaceState(null, null, url.pathname + url.search + url.hash)
      }
    })()
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e5f38" />
  <title>سفربان | SafarBan</title>
  <link rel="icon" type="image/png" href="/icons/icon-48.png" />
  <link href="/fonts/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-vazir">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
