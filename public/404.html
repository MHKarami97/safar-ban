<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سفربان</title>
  <script>
    // GitHub Pages has no server-side router, so any deep link (e.g. /regions)
    // that isn't a real file hits this 404 page. We remember the requested
    // URL and bounce to the SPA root; index.html restores it via
    // history.replaceState before Vue Router resolves the route.
    sessionStorage.setItem('safarban-redirect', location.href)
  </script>
  <meta http-equiv="refresh" content="0;url=/" />
</head>
<body></body>
</html>
